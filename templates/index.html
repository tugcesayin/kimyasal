<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KimyaSal — Tehlike Sorgulama</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161820;
      --surface2: #1e2030;
      --border: #2a2d3e;
      --accent: #5ce1e6;
      --accent2: #ff6b6b;
      --text: #e8eaf0;
      --muted: #6b7080;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 0;
    }

    /* HEADER */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
    }

    .logo {
      font-family: var(--mono);
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent2); }

    .logo-sub {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 2px;
    }

    /* MAIN LAYOUT */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* SEARCH */
    .search-section {
      margin-bottom: 3rem;
    }

    .search-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.75rem;
    }

    .search-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 1rem;
      padding: 0.85rem 1.2rem;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder { color: var(--muted); }

    button#araBtn {
      background: var(--accent);
      color: #0d0f14;
      border: none;
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.85rem 1.8rem;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.2s, transform 0.1s;
    }

    button#araBtn:hover { opacity: 0.85; }
    button#araBtn:active { transform: scale(0.98); }
    button#araBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* LOADING */
    #yukleniyor {
      display: none;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR */
    #hata {
      display: none;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: var(--accent2);
      font-family: var(--mono);
      font-size: 0.85rem;
      margin-top: 1rem;
    }

    /* RESULT */
    #sonuc { display: none; }

    /* MOL CARD */
    .mol-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      animation: fadeUp 0.4s ease;
    }

    .mol-name {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
    }

    .mol-meta {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .meta-item {
      text-align: center;
    }

    .meta-key {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
    }

    .meta-val {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 700;
    }

    /* PIKTOGRAM */
    .section-title {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .piktogram-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
      animation: fadeUp 0.4s ease 0.1s both;
    }

    .piktogram-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .piktogram-chip .sembol { font-size: 1.3rem; }

    /* H KODLARI */
    .h-group { margin-bottom: 1.5rem; }

    .h-group-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .h-group-ikon { font-size: 1rem; }

    .h-group-isim {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .h-group-count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .h-list { display: flex; flex-direction: column; gap: 0.4rem; }

    .h-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 1rem;
      animation: fadeUp 0.3s ease both;
    }

    .h-badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      flex-shrink: 0;
      color: #fff;
    }

    .h-text {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.45;
    }

    .no-data {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 1rem;
    }

    /* PUBCHEM LINK */
    .pubchem-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      margin-top: 1rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .pubchem-link:hover { color: var(--accent); border-color: var(--accent); }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: #fff;
      background: #e74c3c;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      margin-top: 1rem;
      margin-left: 0.5rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .pdf-btn:hover { opacity: 0.85; }

    /* 3D VIEWER */
    #viewer3d {
      width: 100%;
      height: 350px;
      border-radius: 12px;
      background: #1a1a2e;
      border: 1px solid var(--border);
      margin-top: 0.75rem;
      position: relative;
      overflow: hidden;
    }
    .viewer-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .viewer-tab {
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .viewer-tab.active {
      background: var(--accent);
      color: #0d0f14;
      border-color: var(--accent);
    }

    /* AUTOCOMPLETE */
    .search-wrapper { position: relative; flex: 1; }
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
    }
    .autocomplete-item {
      padding: 0.65rem 1.2rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .autocomplete-item:hover { background: var(--border); color: var(--accent); }
    .autocomplete-item:last-child { border-bottom: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://3dmol.org/build/3Dmol-min.js"></script>
</head>
<body>
  <header>
    <div>
      <div class="logo">Kimya<span>Sal</span></div>
      <div class="logo-sub">GHS Tehlike Sorgulama Aracı</div>
    </div>
  </header>

  <main>
    <div class="search-section">
      <span class="search-label">Kimyasal Adı</span>
      <div class="search-row">
        <div class="search-wrapper">
          <input type="text" id="kimyasalInput" placeholder="örn: sülfürik asit, etanol, benzen..." autocomplete="off" />
          <div class="autocomplete-list" id="autocompleteList" style="display:none"></div>
        </div>
        <button id="araBtn" onclick="ara()">Sorgula</button>
      </div>
      <div id="yukleniyor"><div class="spinner"></div> PubChem'den veri alınıyor...</div>
      <div id="hata"></div>
    </div>

    <div id="sonuc">
      <div class="mol-card" id="molCard"></div>

      <div id="yapiDiv" style="display:none;margin-bottom:1.5rem;animation:fadeUp 0.4s ease">
        <div class="section-title">Molekül Yapısı</div>
        <div class="viewer-tabs">
          <button class="viewer-tab active" onclick="goster2D()">2D</button>
          <button class="viewer-tab" onclick="goster3D()" id="tab3d">3D</button>
        </div>
        <div id="yapi2d" style="background:white;border-radius:12px;padding:1rem;display:inline-block">
          <img id="yapiImg" src="" alt="Molekül yapısı" style="display:block;border-radius:8px;max-width:300px"/>
        </div>
        <div id="yapi3d" style="display:none">
          <div id="viewer3d"></div>
          <div style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);margin-top:0.5rem">Sürükle: döndür | Kaydır: yakınlaştır | Sağ tık: kaydır</div>
        </div>
      </div>

      <div class="piktogram-grid" id="piktogramlar"></div>

      <div id="hKodlari"></div>

      <a id="pubchemLink" href="#" target="_blank" class="pubchem-link">
        ↗ PubChem'de Aç
      </a>
      <button class="pdf-btn" onclick="pdfIndir()">⬇ PDF Rapor İndir</button>
    </div>
  </main>

  <script>
    document.getElementById('kimyasalInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') ara();
    });

    async function ara() {
      const kimyasal = document.getElementById('kimyasalInput').value.trim();
      if (!kimyasal) return;

      document.getElementById('sonuc').style.display = 'none';
      document.getElementById('hata').style.display = 'none';
      document.getElementById('yukleniyor').style.display = 'flex';
      document.getElementById('araBtn').disabled = true;

      try {
        const res = await fetch('/ara', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kimyasal })
        });
        const data = await res.json();

        document.getElementById('yukleniyor').style.display = 'none';
        document.getElementById('araBtn').disabled = false;

        if (data.hata) {
          const hataDiv = document.getElementById('hata');
          hataDiv.textContent = '⚠ ' + data.hata;
          hataDiv.style.display = 'block';
          return;
        }

        // MOL CARD
        document.getElementById('molCard').innerHTML = `
          <div class="mol-name">${data.isim}</div>
          <div class="mol-meta">
            <div class="meta-item">
              <span class="meta-key">Formül</span>
              <span class="meta-val">${data.formul}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Mol Ağırlığı</span>
              <span class="meta-val">${parseFloat(data.agirlik).toFixed(3)} g/mol</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">CID</span>
              <span class="meta-val">${data.cid}</span>
            </div>
          </div>
        `;

        // YAPI RESMİ
        if (data.yapi_url) {
          document.getElementById('yapiImg').src = data.yapi_url;
          document.getElementById('yapiDiv').style.display = 'block';
        } else {
          document.getElementById('yapiDiv').style.display = 'none';
        }

        // PİKTOGRAMLAR
        const piktDiv = document.getElementById('piktogramlar');
        if (data.piktogramlar.length > 0) {
          piktDiv.innerHTML = `<div class="section-title" style="width:100%">GHS Piktogramları</div>` +
            data.piktogramlar.map(p => `
              <div class="piktogram-chip" style="border-color:${p.renk}33">
                <span>${p.isim}</span>
              </div>
            `).join('');
        } else {
          piktDiv.innerHTML = '';
        }

        // H KODLARI — kategoriye göre grupla
        const gruplar = {};
        for (const h of data.h_kodlari) {
          if (!gruplar[h.kategori]) gruplar[h.kategori] = { renk: h.renk, ikon: h.ikon, liste: [] };
          gruplar[h.kategori].liste.push(h);
        }

        const hDiv = document.getElementById('hKodlari');
        if (data.h_kodlari.length === 0) {
          hDiv.innerHTML = '<div class="no-data">Tehlike kodu bulunamadı.</div>';
        } else {
          hDiv.innerHTML = Object.entries(gruplar).map(([kat, g], gi) => `
            <div class="h-group" style="animation-delay:${gi * 0.05}s">
              <div class="h-group-header">
                <span class="h-group-ikon">${g.ikon}</span>
                <span class="h-group-isim" style="color:${g.renk}">${kat}</span>
                <span class="h-group-count">${g.liste.length} kod</span>
              </div>
              <div class="h-list">
                ${g.liste.map((h, i) => `
                  <div class="h-item" style="animation-delay:${(gi * 0.05 + i * 0.03)}s">
                    <span class="h-badge" style="background:${h.renk}">${h.kod}</span>
                    <span class="h-text">${h.tr}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
        }

        // PUBCHEM LİNK
        document.getElementById('pubchemLink').href = `https://pubchem.ncbi.nlm.nih.gov/compound/${data.cid}`;

        sonVeri = data;
        guncelCid = data.cid;
        document.getElementById('sonuc').style.display = 'block';

      } catch (err) {
        document.getElementById('yukleniyor').style.display = 'none';
        document.getElementById('araBtn').disabled = false;
        const hataDiv = document.getElementById('hata');
        hataDiv.textContent = '⚠ Sunucu hatası: ' + err.message;
        hataDiv.style.display = 'block';
      }
    }

    let sonVeri = null;
    let nglStage = null;
    let guncelCid = null;

    function goster2D() {
      document.getElementById('yapi2d').style.display = 'inline-block';
      document.getElementById('yapi3d').style.display = 'none';
      document.querySelectorAll('.viewer-tab')[0].classList.add('active');
      document.querySelectorAll('.viewer-tab')[1].classList.remove('active');
    }

    function goster3D() {
      document.getElementById('yapi2d').style.display = 'none';
      document.getElementById('yapi3d').style.display = 'block';
      document.querySelectorAll('.viewer-tab')[0].classList.remove('active');
      document.querySelectorAll('.viewer-tab')[1].classList.add('active');
      yukle3D();
    }

    function yukle3D() {
      if (!guncelCid) return;
      const container = document.getElementById('viewer3d');
      container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-family:var(--mono);font-size:0.8rem">Yükleniyor...</div>';

      const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${guncelCid}/SDF?record_type=3d`;
      fetch(url).then(r => r.text()).then(sdfData => {
        container.innerHTML = '';
        const viewer = $3Dmol.createViewer(container, {
          backgroundColor: '#1a1a2e',
          antialias: true,
        });
        viewer.addModel(sdfData, 'sdf');
        viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: 'Jmol' }, sphere: { scale: 0.3, colorscheme: 'Jmol' } });
        viewer.zoomTo();
        viewer.render();
        viewer.zoom(1.2);
      }).catch(() => {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-family:var(--mono);font-size:0.8rem">3D yapı bulunamadı</div>';
      });
    }
    let autocompleteTimeout = null;

    document.getElementById('kimyasalInput').addEventListener('input', function() {
      clearTimeout(autocompleteTimeout);
      const val = this.value.trim();
      if (val.length < 2) {
        document.getElementById('autocompleteList').style.display = 'none';
        return;
      }
      autocompleteTimeout = setTimeout(() => fetchAutocomplete(val), 300);
    });

    document.getElementById('kimyasalInput').addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('autocompleteList').style.display = 'none';
      }
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-wrapper')) {
        document.getElementById('autocompleteList').style.display = 'none';
      }
    });

    const TURKCE_LISTE = ["nitrik asit","sülfürik asit","hidroklorik asit","asetik asit","fosforik asit","sitrik asit","okzalik asit","formik asit","laktik asit","tartarik asit","malik asit","borik asit","hidroflorik asit","benzoik asit","salisillik asit","akrilik asit","sodyum hidroksit","potasyum hidroksit","kalsiyum hidroksit","magnezyum hidroksit","amonyum hidroksit","etanol","metanol","propanol","izopropanol","bütanol","gliserin","etilen glikol","propilen glikol","benzil alkol","fenol","aseton","formaldehit","asetaldehit","benzaldehit","glutaraldehit","benzen","toluen","ksilen","stiren","naftalin","anilin","nitrobenzen","klorobenzen","piridin","kloroform","karbon tetraklorür","diklorometan","etil asetat","metil asetat","amonyak","hidrojen","oksijen","azot","klor","karbon dioksit","kükürt dioksit","karbon monoksit","hidrojen peroksit","ozon","sodyum klorür","potasyum klorür","kalsiyum karbonat","sodyum bikarbonat","sodyum karbonat","potasyum permanganat","sodyum hipoklorit","bakır sülfat","gümüş nitrat","demir","bakır","çinko","alüminyum","kurşun","civa","arsenik","kükürt","fosfor","karbon","nikel","krom","gümüş","altın","platin","titanyum","hekzan","heptan","sikloheksan","dmso","asetonitril","glikoz","fruktoz","sakkaroz","üre","kafein","kolesterol","aspirin","parasetamol","ibuprofen","etilen","asetilen","indol","imidazol"];

    async function fetchAutocomplete(query) {
      const q = query.toLowerCase();
      
      // Türkçe listeden eşleşenleri bul
      const trSonuclar = TURKCE_LISTE.filter(k => k.startsWith(q)).slice(0, 4);
      
      // PubChem'den İngilizce öneriler al
      try {
        const url = `https://pubchem.ncbi.nlm.nih.gov/rest/autocomplete/compound/${encodeURIComponent(query)}/JSON?limit=6`;
        const res = await fetch(url);
        const data = await res.json();
        const enSonuclar = data?.dictionary_terms?.compound || [];
        
        // İkisini birleştir, tekrarları kaldır
        const tumSonuclar = [...new Set([...trSonuclar, ...enSonuclar])].slice(0, 8);
        showAutocomplete(tumSonuclar);
      } catch(e) {
        showAutocomplete(trSonuclar);
      }
    }

    function showAutocomplete(items) {
      const list = document.getElementById('autocompleteList');
      if (!items.length) { list.style.display = 'none'; return; }
      list.innerHTML = items.map(item => 
        `<div class="autocomplete-item" onclick="secItem('${item.replace(/'/g, "\'")}')">${item}</div>`
      ).join('');
      list.style.display = 'block';
    }

    function secItem(isim) {
      document.getElementById('kimyasalInput').value = isim;
      document.getElementById('autocompleteList').style.display = 'none';
      ara();
    }

    async function pdfIndir() {
      if (!sonVeri) return;
      const res = await fetch('/pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sonVeri)
      });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${sonVeri.isim}_tehlike_raporu.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
