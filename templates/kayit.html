{% extends "auth_base.html" %}
{% block baslik %}Kayıt Ol{% endblock %}
{% block icerik %}
  <h1>Hesap oluştur</h1>
  <p class="alt-baslik">kimyasAl'a ücretsiz katıl.</p>
  <form id="kayit-formu" method="POST" action="{{ url_for('kayit_sayfasi') }}">
    <div class="alan-satir">
      <div class="alan">
        <label for="isim">İsim</label>
        <input id="isim" name="isim" autocomplete="given-name" required autofocus>
      </div>
      <div class="alan">
        <label for="soyisim">Soyisim</label>
        <input id="soyisim" name="soyisim" autocomplete="family-name">
      </div>
    </div>
    <div class="alan">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="alan">
      <label for="sifre">Şifre</label>
      <input id="sifre" name="sifre" type="password" minlength="6" autocomplete="new-password" required>
    </div>
    <div class="alan">
      <label for="sifre2">Şifre (tekrar)</label>
      <input id="sifre2" type="password" minlength="6" autocomplete="new-password" required>
    </div>
    <button class="btn" id="kayit-btn" type="submit">Kayıt Ol</button>
  </form>
  <p class="alt-link">Zaten hesabın var mı? <a href="{{ url_for('giris_yap') }}">Giriş yap</a></p>

  <script>
    const form = document.getElementById('kayit-formu');
    const btn = document.getElementById('kayit-btn');
    const mesajKutusu = document.getElementById('js-mesaj');

    function hataGoster(metin) {
      mesajKutusu.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'mesaj mesaj-danger';
      div.textContent = metin;
      mesajKutusu.appendChild(div);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (form.sifre.value !== document.getElementById('sifre2').value) {
        hataGoster('Şifreler birbiriyle aynı değil.');
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch(form.action, { method: 'POST', body: new FormData(form) });
        const data = await res.json();
        if (data.durum === 'basarili') {
          window.location.href = data.yonlendir;
        } else {
          hataGoster(data.mesaj || 'Kayıt sırasında bir hata oluştu.');
        }
      } catch (err) {
        hataGoster('Sunucuya ulaşılamadı. Lütfen tekrar deneyin.');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
{% endblock %}
